name: Windows TUN recovery experiment

on:
  workflow_dispatch:
  push:
    branches: [experiment-tun-recovery]

permissions:
  contents: read

concurrency:
  group: experiment-tun-recovery
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  RUSTUP_TOOLCHAIN: '1.99.0'
  GODEBUG: http2client=0
  GOPROXY: 'https://proxy.golang.org|direct'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  CI: 'true'

jobs:
  windows:
    if: github.repository == 'aishuishuishui277/FlClash' && github.ref == 'refs/heads/experiment-tun-recovery'
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: core/go.sum
      - name: Prefetch pinned Go modules
        working-directory: core
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            go mod download
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (5 * $attempt)
          }
          go mod verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- go.mod go.sum
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned Rust and packaging tools
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin' >> $env:GITHUB_PATH
          }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/helper
            plugins/rust_api/rust
      - uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Fetch the official v0.9.2 CA bundle
        run: |
          $bundle = 'core/Clash.Meta/component/ca/ca-certificates.crt'
          Invoke-WebRequest -Uri 'https://curl.se/ca/cacert-2026-09-25.pem' -OutFile $bundle -MaximumRetryCount 3 -RetryIntervalSec 3
          if ((Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505') { throw 'CA bundle differs from official v0.9.2 build' }
      - name: Resolve, verify and analyze
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tool/verify_tun_experiment.py source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart format --output=none --set-exit-if-changed lib/common/task.dart test/common/task_windows_interface_experiment_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze --no-pub --no-fatal-infos
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify mihomo accepts the explicit interface
        working-directory: core
        env:
          CGO_ENABLED: '0'
        run: |
          if (gofmt -l experiment_interface_test.go) { throw 'Go test needs formatting' }
          go test -count=1 -run '^TestWindowsOutboundInterfaceExperiment$' .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test original configuration and startup paths
        run: |
          flutter test --no-pub --reporter expanded test/common/task_windows_interface_experiment_test.dart test/common/task_tun_override_test.dart test/models/tun_test.dart test/core/desktop test/core/service_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test opt-in WLAN configuration with native hooks enabled
        env:
          FLCLASH_TUN_INTERFACE: WLAN
        run: flutter test --no-pub --reporter expanded test/common/task_windows_interface_experiment_test.dart
      - name: Build the native Windows x64 portable package
        run: dart setup.dart windows --targets zip --env stable -v
      - name: Validate complete package and add experiment tools
        run: python tool/verify_tun_experiment.py package
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-tun-recovery-windows-x64-${{ github.sha }}
          path: delivery/tun-experiment/
          if-no-files-found: error
          retention-days: 30
