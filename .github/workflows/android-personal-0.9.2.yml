name: Android v0.9.2 private release

on:
  workflow_dispatch:
  push:
    branches: [personal-android-0.9.2]

permissions:
  contents: read

concurrency:
  group: android-personal-release-0.9.2
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  RUSTUP_TOOLCHAIN: '1.99.0'
  GODEBUG: http2client=0
  GOPROXY: 'https://proxy.golang.org|direct'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  CI: 'true'

jobs:
  android:
    if: github.repository == 'aishuishuishui277/FlClash' && github.ref == 'refs/heads/personal-android-0.9.2'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure required persistent personal signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_PERSONAL_KEYSTORE }}
          KEY_ALIAS: ${{ secrets.ANDROID_PERSONAL_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_PERSONAL_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_PERSONAL_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          keys = ['KEYSTORE', 'KEY_ALIAS', 'STORE_PASSWORD', 'KEY_PASSWORD']
          values = [os.environ.get(key, '') for key in keys]
          if not all(values):
              raise SystemExit('Persistent private signing requires all four dedicated secrets; no debug fallback')
          Path('android/app/keystore.jks').write_bytes(base64.b64decode(values[0], validate=True))
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          with Path('android/local.properties').open('a', encoding='utf-8') as file:
              for key, value in zip(['keyAlias', 'storePassword', 'keyPassword'], values[1:]):
                  file.write('\n' + key + '=' + escape(value))
          PY
          keytool -list -storetype PKCS12 -keystore android/app/keystore.jks -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null
          echo 'Persistent signing keystore verified before native builds'
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - name: Install pinned Android and Rust tools
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add aarch64-linux-android --toolchain "$RUSTUP_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            plugins/rust_api/rust
            services/helper
      - uses: gradle/actions/setup-gradle@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Fetch official v0.9.2 CA bundle
        run: |
          set -euo pipefail
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" https://curl.se/ca/cacert-2026-09-25.pem
          echo "a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505  $bundle" | sha256sum -c -
      - name: Verify locked Go modules and apply audited R3 source hooks
        working-directory: core
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            go mod download && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          go mod verify
          python3 ../tool/android-startup/r3_sources.py apply
      - name: Resolve, verify and analyze
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          python3 tool/verify_android_personal.py source
          flutter analyze --no-pub --no-fatal-infos
      - name: Verify Go wrapper behavior
        working-directory: core
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          git diff --exit-code -- go.mod go.sum
          go test -count=1 .
          CGO_ENABLED=1 go test -race -count=1 -v -run '^TestStartupEpoch' github.com/metacubex/sing-quic/hysteria2 | tee ../r3-epoch-tests.txt
      - name: Test VPN adoption, network changes and config compatibility
        run: |
          flutter test --no-pub --reporter expanded test/providers/setup_action_test.dart test/manager/vpn_manager_test.dart test/manager/connectivity_manager_test.dart test/manager/core_manager_test.dart test/models/core_test.dart test/models/tun_test.dart test/common/task_tun_override_test.dart test/common/task_dns_override_test.dart test/plugins/service_test.dart
      - name: Build native ARM64 release APK
        run: dart setup.dart android --arch arm64 --env stable -v
      - name: Preserve candidate APK before final acceptance
        run: python3 tool/verify_android_personal.py candidate
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-android-0.9.2-personal-release-arm64-${{ github.sha }}
          path: delivery/android-candidate/
          if-no-files-found: error
          retention-days: 30
      - name: Inspect Gradle tasks and Android runtime graph
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :common:tasks --all :service:tasks --all :app:tasks --all > ../android-gradle-tasks.txt
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > ../android-runtime-dependencies.txt
      - name: Run upstream Android JVM tests
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest -Ptarget-platform=android-arm64 -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug
      - name: Validate package, signature, SDK exclusion and test results
        run: python3 tool/verify_android_personal.py android
      - uses: actions/upload-artifact@v4
        with:
          name: android-0.9.2-personal-release-arm64-${{ github.sha }}
          path: delivery/android/
          if-no-files-found: error
          retention-days: 30
      - name: Restore dependency sources before module cache save
        if: always()
        working-directory: core
        run: |
          set -euo pipefail
          python3 ../tool/android-startup/r3_sources.py restore
          go mod verify
          git diff --exit-code -- go.mod go.sum Clash.Meta/go.mod Clash.Meta/go.sum
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-0.9.2-personal-release-evidence-${{ github.sha }}
          path: |
            android-gradle-tasks.txt
            android-runtime-dependencies.txt
            r3-source-provenance.json
            r3-epoch-tests.txt
            build/**/test-results/**/*.xml
            delivery/android/*.json
            delivery/android/*.txt
            delivery/android/*.xml
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        run: rm -f android/app/keystore.jks android/local.properties
